# Checks that run on every pull request and on main. None of them needs the vendor's data (several GB, never committed):
# the database job builds a small invented dataset (pipeline/synthetic) in a throwaway PostGIS container.
#
# What is NOT run here: anything that needs the real data or the real bucket. The browser tests run against the same
# invented dataset, with the state's map tiles and the photo bucket answered by the tests themselves. See "CI" in CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-24.04 # a fixed version, so a new Ubuntu cannot change the results
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the tests run TypeScript directly, which needs native type stripping
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # typechecks again, then makes the production bundle

  api:
    name: API (typecheck)
    runs-on: ubuntu-24.04 # a fixed version, so a new Ubuntu cannot change the results
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the API requires Node 24 (engines), and runs .ts files directly
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  database:
    name: Database (synthetic data, SQL checks, API tests)
    runs-on: ubuntu-24.04 # a fixed version, so a new Ubuntu cannot change the results
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4 # the same image as docker-compose.yml
        env:
          POSTGRES_USER: oblique
          POSTGRES_PASSWORD: oblique # a throwaway container that lives for this job only
          POSTGRES_DB: oblique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oblique -d oblique_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # generate.ts and the API run TypeScript directly, which needs native type stripping
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Load the invented frames, build the indexes, functions and read-only role, run checks.sql
        # An admin login, since this creates the postgis extension and the viewer_ro role.
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: oblique
          PGPASSWORD: oblique
          PGDATABASE: oblique_test
        run: |
          psql --version
          pipeline/synthetic/load.sh
      - run: npm ci
        working-directory: api
      - name: API tests, as the read-only role the API really uses
        working-directory: api
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: viewer_ro
          PGPASSWORD: viewer_ro
          PGDATABASE: oblique_test
        run: npm test

  browser:
    name: Browser tests (Playwright, synthetic data)
    runs-on: ubuntu-24.04 # a fixed version, so a new Ubuntu cannot change the results
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4 # the same image as docker-compose.yml
        env:
          POSTGRES_USER: oblique
          POSTGRES_PASSWORD: oblique # a throwaway container that lives for this job only
          POSTGRES_DB: oblique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oblique -d oblique_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the API and the generator run TypeScript directly, which needs native type stripping
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Load the invented frames (an admin login, since this creates the postgis extension and the viewer_ro role)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: oblique
          PGPASSWORD: oblique
          PGDATABASE: oblique_test
        run: pipeline/synthetic/load.sh
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: Install the browser Playwright drives
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests, with the API connecting as the read-only role it really uses
        working-directory: web
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: viewer_ro
          PGPASSWORD: viewer_ro
          PGDATABASE: oblique_test
        run: npm run test:e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  hygiene:
    name: Repository hygiene (no data, no secrets)
    runs-on: ubuntu-24.04 # a fixed version, so a new Ubuntu cannot change the results
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No imagery, GeoPackages, database dumps, data folders or env files are tracked
        run: |
          set -u
          # (a committed .env.example, a template with no secrets, is fine)
          bad=$(git ls-files | grep -E -i '\.(tif|tiff|gpkg|parquet|dump|sqlite|shp|jp2)$|^(data|geopackages)/|(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These tracked files look like data or secrets, which must never be committed:"
            echo "$bad"
            exit 1
          fi
      - name: No tracked file is larger than 2 MB
        run: |
          set -u
          big=$(git ls-files -z | xargs -0 -r ls -l | awk '$5 > 2097152 {print $5, $9}' || true)
          if [ -n "$big" ]; then
            echo "Tracked files over 2 MB (data does not belong in the repository):"
            echo "$big"
            exit 1
          fi
